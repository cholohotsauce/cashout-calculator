# The app now runs on Vercel at https://acecashout.com (it has a server and a database,
# which GitHub Pages can't host). This keeps the old github.io link working by publishing
# a page that forwards every visit there.
name: Redirect GitHub Pages to acecashout.com

on:
  push:
    branches: ["main"]
    paths: ["pages-redirect/**", ".github/workflows/nextjs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
